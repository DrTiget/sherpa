[package]
name = "sherpa-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
include_dir = "0.7.4"
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
russh = "0.64.1"
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
