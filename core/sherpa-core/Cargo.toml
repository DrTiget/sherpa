[package]
name = "sherpa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sherpa-lib = { version = "0.1.0", path = "../sherpa-lib" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
sherpa-lib = { path = "../sherpa-lib", features = ["test-util"] }
