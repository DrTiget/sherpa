name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sherpa ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## Установка одной командой

            **Linux / macOS**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/DrTiget/sherpa/main/install.sh | sh
            ```

            **Windows (PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/DrTiget/sherpa/main/install.ps1 | iex
            ```

            ## Файлы

            - Linux: `.AppImage` (для запуска нужен `libfuse2`) и `.deb`
            - macOS: `.dmg` и `.app.tar.gz` (universal: Apple Silicon + Intel)
            - Windows: `.msi` и NSIS `-setup.exe`

            ## Сборки не подписаны

            Код не подписан сертификатами разработчика, поэтому ОС может предупредить при ручной установке:
            - **macOS** — Gatekeeper блокирует приложение: `xattr -dr com.apple.quarantine /Applications/Sherpa.app` (скрипт `install.sh` делает это сам) или ПКМ → «Открыть».
            - **Windows** — SmartScreen: «Подробнее» → «Выполнить в любом случае».
