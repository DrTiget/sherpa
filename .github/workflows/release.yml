name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Релиз создаётся черновиком: пока не загружены все артефакты, "latest" указывает на прежнюю версию.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sherpa ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Установка одной командой (Linux x86_64)

            ```sh
            curl -fsSL https://raw.githubusercontent.com/DrTiget/sherpa/main/install.sh | sh
            ```

            Скрипт ставит AppImage в `~/.local/bin/sherpa` (без sudo), проверяет SHA256. `--deb` — поставить `.deb`, `--uninstall` — удалить.

            ## Файлы

            - `.AppImage` (для запуска нужен `libfuse2`) и `.deb`
            - `SHA256SUMS` — контрольные суммы: `sha256sum -c SHA256SUMS --ignore-missing`

            Сборки для macOS и Windows пока не публикуются. Код не подписан.
      - name: SHA256SUMS и публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd target/release/bundle
          sha256sum appimage/*.AppImage deb/*.deb | sed 's# [^ ]*/# #' > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 2 ] || { echo "ожидались AppImage и deb"; exit 1; }
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          # публикуем, только когда всё загружено; --latest переключает latest атомарно
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
